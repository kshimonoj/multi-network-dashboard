// New Central Streaming API — AP Monitoring のペイロード。
// 出典: https://developer.arubanetworks.com/new-central/docs/streaming-api-event-ap-monitoring
// エンドポイント: wss://<host>/network-monitoring/v1alpha1/ap-events
//   ※ ここだけベースパスが network-services ではなく **network-monitoring** で、
//     event-types の名前空間も com.hpe.greenlake.network-monitoring.v1alpha1.aps.* になる。
//
// event-types → デコードするメッセージの対応(catalog.ts の message と揃えること):
//   aps.state.device                 → APInfo
//   aps.state.radio                  → RadioInfo
//   aps.state.port                   → PortInfo
//   aps.state.virtual_access_point   → VapInfo
//   aps.state.wlan                   → WlanInfo
//   aps.state.tunnel                 → TunnelInfo
//   aps.stats.device                 → APSystemStat
//   aps.stats.radio                  → RadioStat
//   aps.stats.virtual_access_point   → VapStat
//   aps.stats.port                   → PortStat
//   aps.stats.modem                  → ModemStat
//   aps.stats.tunnel                 → TunnelStat
//   aps.stats.ip_probe               → IPProbeStat
//   aps.stats.user_role              → RoleStat
//   aps.stats.ssid                   → SsidStat
//   aps.stats.vlan                   → VlanStat

syntax = "proto3";

