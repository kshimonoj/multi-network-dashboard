<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi Network Dashboard</title>
  <!-- ファビコン。public/favicon.svg は Vite がそのままルート直下に配信/コピーする。 -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <!-- テーマ変数 --sans / --mono が指す IBM Plex。Corstack の index.html と同じ読み込み。 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+JP:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <!-- テーマの初期反映(src/theme.ts と同じキー・同じ判定順)。
       React のマウント前に <html data-theme> を確定させ、初回描画のちらつきを防ぐ。 -->
  <script>
    (function () {
      var stored = null;
      try {
        stored = localStorage.getItem("mnd-theme");
      } catch (e) {
        /* localStorage が使えない環境では OS 既定に従う */
      }
      var theme =
        stored === "dark" || stored === "light"
          ? stored
          : window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark";
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
