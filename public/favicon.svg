<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- multi-network-dashboard ファビコン
       中央ノード + 4 つの周辺ノードのネットワーク図。
       色は src/theme.css のテーマ変数 (bg / accent) と同じ値を使い、
       prefers-color-scheme でダーク/ライトを切り替える(未対応ブラウザはダーク版)。
       16x16 でも潰れないよう、線は太め・ノードは 4 個までに絞っている。 -->
  <style>
    .plate { fill: #12151a; }
    .net   { stroke: #4fd1c5; fill: #4fd1c5; }
    @media (prefers-color-scheme: light) {
      .plate { fill: #f6f6f4; }
      .net   { stroke: #0f9488; fill: #0f9488; }
    }
  </style>
  <rect class="plate" x="0" y="0" width="32" height="32" rx="7" />
  <g class="net" stroke-width="2.2" stroke-linecap="round">
    <path d="M16 16 L8 9 M16 16 L24 9 M16 16 L8 23 M16 16 L24 23" />
  </g>
  <g class="net" stroke="none">
    <circle cx="16" cy="16" r="4.4" />
    <circle cx="8" cy="9" r="3" />
    <circle cx="24" cy="9" r="3" />
    <circle cx="8" cy="23" r="3" />
    <circle cx="24" cy="23" r="3" />
  </g>
</svg>
